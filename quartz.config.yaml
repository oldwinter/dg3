# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: 🌱 oldwinterの数字花园
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: garden.oldwinter.top
  ignorePatterns:
    - private
    - "**/*.excalidraw.md"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: LXGW WenKai
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f7"
        lightgray: "#e6e0dd"
        gray: "#817671"
        darkgray: "#4b4542"
        dark: "#24211f"
        secondary: "#28546a"
        tertiary: "#4f785f"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#151716"
        lightgray: "#2d3430"
        gray: "#87938c"
        darkgray: "#d3d8d2"
        dark: "#f3f0ea"
        secondary: "#8ab2c4"
        tertiary: "#9dbb91"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: ./external-plugins/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
      condition: has-toc
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 30
      rssFullHtml: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source:
      name: theme-switcher
      repo: ./local-plugins/theme-switcher
    enabled: true
    order: 45
    options:
      defaultPreset: linear
      storageKey: themePreset
    layout:
      position: left
      priority: 32
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: has-backlinks
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: afterBody
      priority: 20
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/oldwinter/dg3
  - source: "@quartz-community/recent-notes"
    enabled: true
    order: 50
    options: {}
  - source: "@quartz-community/comments"
    enabled: true
    order: 50
    options:
      provider: giscus
      options: {}
  - source: "@quartz-community/stacked-pages"
    enabled: true
    order: 50
    options:
      maxTabs: 8
      mobileBreakpoint: 800
      showSpines: true
      animateTransitions: true
  - source: "@quartz-community/canvas-page"
    enabled: true
    order: 50
    options: {}
  - source: "@quartz-community/bases-page"
    enabled: true
    order: 50
    options: {}
  - source: "@quartz-community/og-image"
    enabled: true
    order: 50
    options: {}
  - source: "@quartz-community/cname"
    enabled: true
    order: 50
    options: {}
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    order: 50
    options: {}

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
    bases: {}
